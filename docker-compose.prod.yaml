# IMS Production Overlay
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

services:
  node-red:
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  grafana:
    environment:
      - GF_LOG_LEVEL=warn
      - GF_PANELS_DISABLE_SANITIZE_HTML=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  timescaledb:
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  prometheus:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  proxy:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  alarm-api:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  backup:
    image: postgres:16-alpine
    container_name: ims-backup
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - ./nodered_data:/nodered_data:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGHOST: timescaledb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * /scripts/backup.sh >> /backups/cron.log 2>&1" > /etc/crontabs/root
        crond -f
    networks:
      - ims-internal
